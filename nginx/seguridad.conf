# nginx descarta los add_header del server si la location define los suyos: por eso se incluye en cada una
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
# HSTS: durante un año el navegador entra a este host solo por HTTPS, aunque escriban http:// o un enlace lo use
# (el ingress del Container App termina el TLS; por HTTP el navegador ignora este header). Sin includeSubDomains ni
# preload: el dominio es de Azure, no nuestro
add_header Strict-Transport-Security "max-age=31536000" always;
# El panel no usa cámara, micrófono, ubicación, sensores ni pagos: se niegan a la página y a sus iframes (Metabase)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), accelerometer=(), gyroscope=(), magnetometer=(), payment=(), usb=(), browsing-topics=()" always;

# Content-Security-Policy: el navegador solo ejecuta y conecta con lo que se lista aquí, así que un XSS no puede
# cargar scripts de otro sitio ni mandar la sesión (localStorage) a un servidor ajeno.
# Los orígenes de Azure son los mismos de VITE_API_URL en .github/workflows/ci.yml: si cambian, cambiar ambos
set $csp "default-src 'self'; ";
# Script inline de index.html que fija el tema antes de pintar: si se edita, cambia su hash (lo verifica csp.test.js)
set $csp "${csp}script-src 'self' 'sha256-MrwPPjxBuCVbXjs1xolH7gN0d0VEzvFpIpB2/ERtIso='; ";
set $csp "${csp}style-src 'self'; ";
# data: para las fotos de evidencias (llegan como data URL) y blob: para las teselas que decodifica MapLibre
set $csp "${csp}img-src 'self' data: blob: https://server.arcgisonline.com; ";
set $csp "${csp}font-src 'self'; ";
# Backend (REST y Socket.IO), teselas satelitales de Esri y el canje de tokens de MSAL
set $csp "${csp}connect-src 'self' https://cmp-backend.blueglacier-678ef622.chilecentral.azurecontainerapps.io wss://cmp-backend.blueglacier-678ef622.chilecentral.azurecontainerapps.io https://server.arcgisonline.com https://login.microsoftonline.com; ";
# Worker de MapLibre (se sirve desde /assets)
set $csp "${csp}worker-src 'self' blob:; ";
# Dashboards embebidos de Metabase
set $csp "${csp}frame-src https://cmp-metabase.blueglacier-678ef622.chilecentral.azurecontainerapps.io; ";
set $csp "${csp}object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
add_header Content-Security-Policy $csp always;