server {
    listen 80;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Sonda de salud del Container App y verificación del pipeline
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Página puente del login con Microsoft (MSAL 5): sin caché y sin COOP
    location = /redirect.html {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-store" always;
    }

    # Archivos con hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/seguridad.conf;
        add_header Cache-Control "no-cache" always;
    }

    # React Router: cualquier ruta que no sea un archivo (/mapa, /flota...) carga la app
    location / {
        include /etc/nginx/snippets/seguridad.conf;
        try_files $uri /index.html;
    }
}
