# Análisis estático de seguridad del código (XSS, inyecciones, manejo inseguro de datos, etc.).
# Corre en cada PR hacia main, en main y una vez por semana (detecta reglas nuevas de CodeQL).
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1' # lunes 06:00 en Chile (UTC-3)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analizar:
    name: Analizar (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # publica los hallazgos en la pestaña Security del repositorio
    steps:
      - uses: actions/checkout@v7

      # JavaScript no necesita compilarse para el análisis
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
