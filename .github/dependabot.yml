# Actualizaciones semanales de dependencias. Cada PR de Dependabot pasa por el mismo CI que el resto.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Parches y versiones menores en un solo PR para no saturar; las mayores van por separado
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
